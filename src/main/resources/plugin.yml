name: DiscordBridge
version: '1.0.0'
main: net.msstore.discordbridge.DiscordBridgePlugin
api-version: '26.2'
author: You
description: Forwards console output to a Discord channel and lets whitelisted Discord users run console commands.

commands:
  dcbridge:
    description: Manage the DiscordBridge whitelist.
    usage: "/<command> whitelist|unwhitelist <discord_user_id>"

permissions:
  dcbridge.whitelist:
    description: Allows whitelisting a Discord user ID to run console commands.
    default: op
  dcbridge.unwhitelist:
    description: Allows removing a Discord user ID from the whitelist.
    default: op
